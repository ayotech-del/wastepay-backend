name: wastepay
description: WastePay Nigeria — Waste Management Payment App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  http: ^1.2.1
  dio: ^5.4.3+1
  
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Storage
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  
  # QR scanning
  mobile_scanner: ^5.1.1
  
  # Maps (for bin locator)
  google_maps_flutter: ^2.6.1
  
  # Firebase
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  geolocator: ^12.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
